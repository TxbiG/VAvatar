name: Build

on:
  push:
    branches: [ main, develop ] # Optimize 1: Limit triggers to prevent wasted minutes
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release] # Optimize 2: Matrix added to ensure both build types are verified
    runs-on: windows-2022
    steps:
      - name: Checkout VAvatar
        uses: actions/checkout@v4
        with:
          path: VAvatar

      - name: Checkout Moss (dependency)
        uses: actions/checkout@v4
        with:
          repository: TxbiG/Moss
          path: Moss
          submodules: recursive

      # Optimize 3: MSVC Compiler caching for Windows
      - name: Setup Sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Configure
        working-directory: VAvatar
        env:
          # Wire Sccache into the CMake environment for MSVC
          CMAKE_CONFIG_FLAGS: "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DMOSS_FRAMEWORK_DIR="${{ github.workspace }}/Moss"
          $env:CMAKE_CONFIG_FLAGS

      # Optimize 4: Enabled parallel MSBuild compilation and dynamic configuration
      - name: Build
        working-directory: VAvatar
        run: >
          cmake --build build 
          --config ${{ matrix.config }} 
          --parallel %NUMBER_OF_PROCESSORS%
